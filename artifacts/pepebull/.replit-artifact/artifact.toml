kind = "web"
previewPath = "/"
title = "$PEPEBULL — The Green Bull"
version = "1.0.0"
id = "artifacts/pepebull"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21878

[services.development]
run = "pnpm --filter @workspace/pepebull run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pepebull", "run", "build" ]
serve = "static"
publicDir = "artifacts/pepebull/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21878"
BASE_PATH = "/"
